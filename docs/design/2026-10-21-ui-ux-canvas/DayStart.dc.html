<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Day 시작</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2556C4}a:hover{color:#1A3F94}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 18px;border-radius:12px;border:1px solid #DCE2DD;background:#FFFFFF;color:#18201B;font:inherit;font-size:16px;font-weight:500;text-decoration:none;box-sizing:border-box;cursor:pointer}
.btn.primary{background:#2556C4;border-color:#2556C4;color:#FFFFFF;font-weight:700}
.btn.primary:hover{background:#1A3F94;color:#FFFFFF}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:0;background:transparent;color:#18201B;cursor:pointer;text-decoration:none}
.icon-btn:hover{background:#ECEEEC;color:#18201B}
.step{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border-top:1px solid #ECEEEC;color:#18201B;text-decoration:none}
.step:hover{background:#F5F6F4;color:#18201B}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1.5px solid #DCE2DD;background:#FFFFFF;cursor:pointer}
.opt:hover{border-color:#A9B3AC}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F4; color: #18201B; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <header style="position: absolute; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; gap: 4px; padding: 8px 8px 0; box-sizing: border-box; background: #F5F6F4">
    <a class="icon-btn" href="Workbook.dc.html" aria-label="문제집으로 돌아가기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 15px; font-weight: 700">문제집</span>
  </header>

  <main style="position: absolute; inset: 60px 0 84px 0; overflow: auto; padding: 8px 0 24px">
    <div style="padding: 0 20px">
      <span style="display: inline-block; padding: 2px 10px; border-radius: 999px; background: #EAF0FD; color: #1A3F94; font-size: 13px; font-weight: 700">Day 3 · 1단계 문법 기초</span>
      <h1 style="margin: 10px 0 0; font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.4px">대명사 · When 의문문</h1>
    </div>

    <section aria-labelledby="goal-title" style="margin: 16px 16px 0; padding: 16px; background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 16px">
      <h2 id="goal-title" style="margin: 0; font-size: 15px; font-weight: 700">오늘의 목표</h2>
      <ul style="margin: 8px 0 0; padding-left: 20px; font-size: 15px; line-height: 1.6">
        <li>대명사의 다섯 가지 모양을 구분한다</li>
        <li>빈칸 뒤를 보고 주격·소유격·목적격을 고른다</li>
        <li>When 질문에 맞는 응답을 고른다</li>
      </ul>
    </section>

    <section aria-labelledby="plan-title" style="margin: 20px 16px 0">
      <h2 id="plan-title" style="margin: 0 4px 8px; font-size: 15px; font-weight: 700">오늘 할 일 · 원하는 곳부터 시작</h2>
      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="2">
        <div style="margin-bottom: 10px; background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 16px; overflow: hidden">
          <div style="padding: 12px 16px">
            <span style="display: block; font-size: 12px; font-weight: 700; color: #2556C4">{{b.kind}}</span>
            <span style="display: block; font-size: 16px; font-weight: 700">{{b.title}}</span>
          </div>
          <sc-for list="{{b.steps}}" as="s" hint-placeholder-count="3">
            <a class="step" href="Question.dc.html">
              <span style="width: 28px; height: 28px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: #ECEEEC; color: #4D5550; font-size: 13px; font-weight: 700">{{s.n}}</span>
              <span style="flex: 1; font-size: 15px">{{s.name}}</span>
              <span style="font-size: 13px; color: #5A645E">{{s.count}}</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A645E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </section>

    <fieldset style="margin: 14px 16px 0; padding: 0; border: 0">
      <legend style="margin: 0 4px 8px; padding: 0; font-size: 15px; font-weight: 700">채점 방식</legend>
      <div style="display: grid; gap: 8px">
        <label class="opt" style="{{instantStyle}}">
          <input type="radio" name="mode" checked="{{instantChecked}}" onChange="{{pickInstant}}" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #2556C4">
          <span>
            <span style="display: block; font-size: 15px; font-weight: 700">한 문제씩 바로 확인</span>
            <span style="display: block; font-size: 13px; color: #5A645E">고를 때마다 정답과 해설을 봐요</span>
          </span>
        </label>
        <label class="opt" style="{{examStyle}}">
          <input type="radio" name="mode" checked="{{examChecked}}" onChange="{{pickExam}}" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #2556C4">
          <span>
            <span style="display: block; font-size: 15px; font-weight: 700">다 풀고 한 번에 채점</span>
            <span style="display: block; font-size: 13px; color: #5A645E">시험처럼 끝까지 풀고 점수를 봐요</span>
          </span>
        </label>
      </div>
      <p style="margin: 8px 4px 0; font-size: 13px; color: #5A645E">이번 풀이에만 적용돼요. 다시 풀 때 바꿀 수 있어요.</p>
    </fieldset>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 16px 22px; background: #FFFFFF; border-top: 1px solid #DCE2DD">
    <a class="btn primary" href="Question.dc.html" style="width: 100%">처음부터 시작</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'instant' };
  }
  renderVals() {
    const instant = this.state.mode === 'instant';
    const on = 'border-color: #2556C4; background: #F3F6FE';
    return {
      instantChecked: instant,
      examChecked: !instant,
      instantStyle: instant ? on : '',
      examStyle: instant ? '' : on,
      pickInstant: () => this.setState({ mode: 'instant' }),
      pickExam: () => this.setState({ mode: 'exam' }),
      blocks: [
        { kind: 'RC · Part 5 단문 빈칸', title: '대명사', steps: [
          { n: 1, name: '개념', count: '3장' },
          { n: 2, name: '따라 풀기', count: '2문제' },
          { n: 3, name: '실전', count: '15문항' }
        ] },
        { kind: 'LC · Part 2 질문 응답', title: 'When 의문문', steps: [
          { n: 1, name: '개념', count: '1장' },
          { n: 2, name: '따라 풀기', count: '1문제' },
          { n: 3, name: '실전', count: '10문항' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
