<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>복습</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2556C4}a:hover{color:#1A3F94}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid #DCE2DD;background:#FFFFFF;color:#18201B;font:inherit;font-size:15px;font-weight:500;text-decoration:none;box-sizing:border-box;cursor:pointer}
.btn.primary{background:#2556C4;border-color:#2556C4;color:#FFFFFF;font-weight:700}
.btn.primary:hover{background:#1A3F94;color:#FFFFFF}
.seg{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#5A645E;cursor:pointer}
.seg[aria-selected="true"]{background:#FFFFFF;color:#18201B;font-weight:700;box-shadow:0 1px 2px rgba(24,32,27,.12)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.qrow{display:block;padding:14px 16px;border-top:1px solid #ECEEEC;color:#18201B;text-decoration:none}
.qrow:hover{background:#F5F6F4;color:#18201B}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;border-radius:12px;font-size:12px;font-weight:500;color:#5A645E;text-decoration:none}
.tab:hover{color:#18201B}
.tab.on{color:#2556C4;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F4; color: #18201B; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <main style="position: absolute; inset: 0 0 156px 0; overflow: auto; padding-bottom: 16px">
    <header style="padding: 24px 20px 4px">
      <h1 style="margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; letter-spacing: -0.5px">복습</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: #5A645E">Day 상관없이 틀린 것과 헷갈리는 것만 모았어요</p>
    </header>

    <div role="tablist" aria-label="복습 종류" style="display: flex; gap: 4px; margin: 16px 16px 0; padding: 4px; border-radius: 14px; background: #E7EAE7">
      <button class="seg" type="button" role="tab" aria-selected="{{qSelected}}" onClick="{{showQuestions}}">틀린 문제 2</button>
      <button class="seg" type="button" role="tab" aria-selected="{{wSelected}}" onClick="{{showWords}}">헷갈리는 단어 781</button>
    </div>

    <sc-if value="{{isQuestions}}" hint-placeholder-val="{{ true }}">
      <p style="margin: 14px 20px 0; font-size: 13px; color: #5A645E">다시 풀어서 맞히면 목록에서 빠져요.</p>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <section style="margin: 10px 16px 0; background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 16px; overflow: hidden">
          <h2 style="margin: 0; padding: 12px 16px; font-size: 14px; font-weight: 700">{{g.day}}</h2>
          <sc-for list="{{g.items}}" as="q" hint-placeholder-count="1">
            <a class="qrow" href="Question.dc.html">
              <span style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #5A645E">
                <span>{{q.label}}</span>
                <span style="color: #B42318; font-weight: 700">{{q.missed}}</span>
              </span>
              <span lang="en" style="display: block; margin-top: 4px; font-size: 15px; line-height: 1.5">{{q.stem}}</span>
            </a>
          </sc-for>
        </section>
      </sc-for>
    </sc-if>

    <sc-if value="{{isWords}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 14px 20px 0; font-size: 13px; color: #5A645E">처음·애매 단어를 오래 안 본 것부터 20개씩 보여 줘요.</p>
      <div style="display: flex; gap: 6px; margin: 10px 16px 0">
        <span class="chip" style="background: #18201B; color: #FFFFFF">전체 781</span>
        <span class="chip" style="background: #D8EEC9; color: #24521A">처음 218</span>
        <span class="chip" style="background: #F1E0C2; color: #5C4318">애매 563</span>
      </div>
      <section style="margin: 10px 16px 0; background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 16px; overflow: hidden">
        <sc-for list="{{words}}" as="w" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #ECEEEC">
            <span style="flex: 1; min-width: 0">
              <span lang="en" style="display: block; font-size: 16px; font-weight: 700">{{w.word}}</span>
              <span style="display: block; font-size: 13px; color: #5A645E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.meaning}}</span>
            </span>
            <span class="chip" style="{{w.chipStyle}}">{{w.status}}</span>
          </div>
        </sc-for>
      </section>
    </sc-if>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 84px; padding: 12px 16px; background: #F5F6F4; border-top: 1px solid #DCE2DD">
    <sc-if value="{{isQuestions}}" hint-placeholder-val="{{ true }}">
      <a class="btn primary" href="Question.dc.html" style="width: 100%">틀린 문제 2개 다시 풀기</a>
    </sc-if>
    <sc-if value="{{isWords}}" hint-placeholder-val="{{ false }}">
      <a class="btn primary" href="CardFront.dc.html" style="width: 100%">카드로 20개 복습</a>
    </sc-if>
  </div>

  <nav aria-label="주 메뉴" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 28px; display: flex; gap: 4px; background: #FFFFFF; border-top: 1px solid #DCE2DD">
    <a class="tab" href="Main.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      오늘
    </a>
    <a class="tab" href="Workbook.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"></path><path d="M22 5h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"></path></svg>
      문제집
    </a>
    <a class="tab" href="Wordbook.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg>
      단어장
    </a>
    <a class="tab on" href="Review.dc.html" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"></path><path d="M3 3v5h5"></path></svg>
      복습
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'questions' };
  }
  renderVals() {
    const isQuestions = this.state.tab === 'questions';
    const fresh = 'background: #D8EEC9; color: #24521A';
    const unsure = 'background: #F1E0C2; color: #5C4318';
    return {
      isQuestions,
      isWords: !isQuestions,
      qSelected: isQuestions ? 'true' : 'false',
      wSelected: isQuestions ? 'false' : 'true',
      showQuestions: () => this.setState({ tab: 'questions' }),
      showWords: () => this.setState({ tab: 'words' }),
      groups: [
        { day: 'Day 1 · 명사 자리', items: [
          { label: '9번 · Part 5 단문 빈칸', missed: '2번 틀림', stem: 'Ms. Chen made an important ------- about the company’s budget.' }
        ] },
        { day: 'Day 2 · 형용사·부사 자리', items: [
          { label: '4번 · Part 5 단문 빈칸', missed: '1번 틀림', stem: 'The shipment will ------- arrive by Thursday.' }
        ] }
      ],
      words: [
        { word: 'characteristic', meaning: '(명) 특성, 특색 (형) 특유의, 독특한', status: '처음', chipStyle: fresh },
        { word: 'compilation', meaning: '(명) 편집, 편찬, 모음집', status: '처음', chipStyle: fresh },
        { word: 'comprehensive', meaning: '(형) 포괄적인, 종합적인, 광범위한', status: '처음', chipStyle: fresh },
        { word: 'conduct', meaning: '(타) 실시하다, 수행하다', status: '처음', chipStyle: fresh },
        { word: 'confidence', meaning: '(명) 자신감, 확신', status: '애매', chipStyle: unsure },
        { word: 'conscious', meaning: '(형) 의식하고 있는, 자각하는', status: '처음', chipStyle: fresh }
      ]
    };
  }
}
</script>
</body>
</html>
