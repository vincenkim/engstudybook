<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>단어장 목록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2556C4}a:hover{color:#1A3F94}
.row{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 12px 10px 16px;border-top:1px solid #ECEEEC;color:#18201B;text-decoration:none;box-sizing:border-box}
.row:hover{background:#F5F6F4;color:#18201B}
.week{width:100%;display:flex;align-items:center;gap:12px;padding:16px;background:transparent;border:0;font:inherit;color:#18201B;text-align:left;cursor:pointer;box-sizing:border-box}
.week:hover{background:#F5F6F4}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;border-radius:12px;font-size:12px;font-weight:500;color:#5A645E;text-decoration:none}
.tab:hover{color:#18201B}
.tab.on{color:#2556C4;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F4; color: #18201B; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <main style="position: absolute; inset: 0 0 84px 0; overflow: auto; padding-bottom: 24px">
    <header style="padding: 24px 20px 4px">
      <h1 style="margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; letter-spacing: -0.5px">단어장</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: #5A645E">4주 · 20일 · 1,003단어</p>
    </header>

    <section aria-label="전체 단어 상태" style="margin: 16px 16px 0; padding: 16px; background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 16px">
      <div role="img" aria-label="처음 218개, 애매 563개, 완벽 168개, 안 봄 54개" style="display: flex; height: 10px; border-radius: 5px; overflow: hidden">
        <span style="width: 21.7%; background: #3E8A2C"></span>
        <span style="width: 56.1%; background: #A9793A"></span>
        <span style="width: 16.8%; background: #D9B300"></span>
        <span style="width: 5.4%; background: #C9CFCB"></span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px">
        <span class="chip" style="background: #D8EEC9; color: #24521A">처음 218</span>
        <span class="chip" style="background: #F1E0C2; color: #5C4318">애매 563</span>
        <span class="chip" style="background: #FFF2A8; color: #4D4100">완벽 168</span>
        <span class="chip" style="background: #ECEEEC; color: #4D5550">안 봄 54</span>
      </div>
      <p style="margin: 10px 0 0; font-size: 13px; color: #5A645E">처음 상태는 PDF에 칠해 둔 색에서 가져왔어요.</p>
    </section>

    <section style="margin: 12px 16px 0; background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 16px; overflow: hidden">
      <button class="week" type="button" aria-expanded="true">
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 16px; font-weight: 700">Week 1</span>
          <span style="display: block; margin-top: 2px; font-size: 13px; color: #5A645E">5일 · 250단어 · 외울 단어 221</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A645E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
      </button>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
        <a class="row" href="WordList.dc.html">
          <span style="flex: 1; min-width: 0">
            <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
              <span style="font-size: 15px; font-weight: 700">{{d.name}}</span>
              <span style="font-size: 13px; color: #5A645E">{{d.meta}}</span>
            </span>
            <span role="img" aria-label="{{d.aria}}" style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 8px">
              <span style="width: {{d.newPct}}; background: #3E8A2C"></span>
              <span style="width: {{d.unsurePct}}; background: #A9793A"></span>
              <span style="width: {{d.donePct}}; background: #D9B300"></span>
              <span style="width: {{d.unseenPct}}; background: #C9CFCB"></span>
            </span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A645E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </section>

    <sc-for list="{{weeks}}" as="w" hint-placeholder-count="3">
      <section style="margin: 12px 16px 0; background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 16px; overflow: hidden">
        <button class="week" type="button" aria-expanded="false">
          <span style="flex: 1; min-width: 0">
            <span style="display: block; font-size: 16px; font-weight: 700">{{w.name}}</span>
            <span style="display: block; margin-top: 2px; font-size: 13px; color: #5A645E">{{w.meta}}</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A645E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
      </section>
    </sc-for>
  </main>

  <nav aria-label="주 메뉴" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 28px; display: flex; gap: 4px; background: #FFFFFF; border-top: 1px solid #DCE2DD">
    <a class="tab" href="Main.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      오늘
    </a>
    <a class="tab" href="Workbook.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"></path><path d="M22 5h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"></path></svg>
      문제집
    </a>
    <a class="tab on" href="Wordbook.dc.html" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg>
      단어장
    </a>
    <a class="tab" href="Review.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"></path><path d="M3 3v5h5"></path></svg>
      복습
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const day = (name, fresh, unsure, done, unseen) => {
      const total = fresh + unsure + done + unseen;
      const pct = n => (n / total * 100).toFixed(1) + '%';
      return {
        name,
        meta: total + '단어 · 외울 단어 ' + (fresh + unsure),
        aria: '처음 ' + fresh + ', 애매 ' + unsure + ', 완벽 ' + done + ', 안 봄 ' + unseen,
        newPct: pct(fresh), unsurePct: pct(unsure), donePct: pct(done), unseenPct: pct(unseen)
      };
    };
    return {
      days: [
        day('Day 1', 25, 17, 8, 0),
        day('Day 2', 16, 26, 5, 3),
        day('Day 3', 22, 22, 6, 0),
        day('Day 4', 29, 16, 3, 1),
        day('Day 5', 16, 32, 2, 1)
      ],
      weeks: [
        { name: 'Week 2', meta: '5일 · 약 250단어' },
        { name: 'Week 3', meta: '5일 · 약 250단어' },
        { name: 'Week 4', meta: '5일 · 약 250단어' }
      ]
    };
  }
}
</script>
</body>
</html>
