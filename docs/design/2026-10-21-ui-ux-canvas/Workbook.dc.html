<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>문제집 목록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2556C4}a:hover{color:#1A3F94}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px 10px 16px;border-top:1px solid #ECEEEC;color:#18201B;text-decoration:none;box-sizing:border-box}
.row:hover{background:#F5F6F4;color:#18201B}
.phase{width:100%;display:flex;align-items:center;gap:12px;padding:16px;background:transparent;border:0;font:inherit;color:#18201B;text-align:left;cursor:pointer;box-sizing:border-box}
.phase:hover{background:#F5F6F4}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;border-radius:12px;font-size:12px;font-weight:500;color:#5A645E;text-decoration:none}
.tab:hover{color:#18201B}
.tab.on{color:#2556C4;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F4; color: #18201B; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <main style="position: absolute; inset: 0 0 84px 0; overflow: auto; padding-bottom: 24px">
    <header style="padding: 24px 20px 4px">
      <h1 style="margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; letter-spacing: -0.5px">문제집</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: #5A645E">40일 · 하루 25문항 · 개념부터 실전까지</p>
    </header>

    <section style="margin: 16px 16px 0; background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 16px; overflow: hidden">
      <button class="phase" type="button" aria-expanded="true">
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 16px; font-weight: 700">1단계 · 문법 기초</span>
          <span style="display: block; margin-top: 2px; font-size: 13px; color: #5A645E">Part 5 + Part 2 · 1 / 16일 완료</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A645E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
      </button>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="6">
        <a class="row" href="{{d.href}}" style="{{d.rowStyle}}">
          <span style="width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 13px; font-weight: 700; {{d.badgeStyle}}">
            <sc-if value="{{d.done}}" hint-placeholder-val="{{ false }}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
            </sc-if>
            <sc-if value="{{d.notDone}}" hint-placeholder-val="{{ true }}">{{d.num}}</sc-if>
          </span>
          <span style="flex: 1; min-width: 0">
            <span style="display: block; font-size: 12px; color: #5A645E">{{d.label}}</span>
            <span style="display: block; font-size: 15px; font-weight: 500; line-height: 1.4">{{d.topics}}</span>
          </span>
          <span style="font-size: 13px; font-weight: 700; white-space: nowrap; {{d.metaStyle}}">{{d.meta}}</span>
        </a>
      </sc-for>
      <button class="phase" type="button" style="justify-content: center; border-top: 1px solid #ECEEEC; font-size: 14px; color: #2556C4; font-weight: 700; min-height: 48px; padding: 0 16px">Day 7–16 더 보기</button>
    </section>

    <sc-for list="{{phases}}" as="p" hint-placeholder-count="3">
      <section style="margin: 12px 16px 0; background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 16px; overflow: hidden">
        <button class="phase" type="button" aria-expanded="false">
          <span style="flex: 1; min-width: 0">
            <span style="display: block; font-size: 16px; font-weight: 700">{{p.name}}</span>
            <span style="display: block; margin-top: 2px; font-size: 13px; color: #5A645E">{{p.meta}}</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A645E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
      </section>
    </sc-for>
  </main>

  <nav aria-label="주 메뉴" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 28px; display: flex; gap: 4px; background: #FFFFFF; border-top: 1px solid #DCE2DD">
    <a class="tab" href="Main.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      오늘
    </a>
    <a class="tab on" href="Workbook.dc.html" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"></path><path d="M22 5h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"></path></svg>
      문제집
    </a>
    <a class="tab" href="Wordbook.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg>
      단어장
    </a>
    <a class="tab" href="Review.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"></path><path d="M3 3v5h5"></path></svg>
      복습
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const done = { badgeStyle: 'background: #E6F4EB; color: #1D7A43', metaStyle: 'color: #1D7A43', rowStyle: '', done: true, notDone: false };
    const current = { badgeStyle: 'background: #FFFFFF; color: #2556C4; box-shadow: inset 0 0 0 2px #2556C4', metaStyle: 'color: #2556C4', rowStyle: 'background: #F3F6FE', done: false, notDone: true };
    const todo = { badgeStyle: 'background: #ECEEEC; color: #5A645E', metaStyle: 'color: #5A645E', rowStyle: '', done: false, notDone: true };
    const days = [
      { ...done, num: 1, label: 'Day 1 · 완료', topics: '명사 자리 · Who 의문문', meta: '21 / 25', href: 'Result.dc.html' },
      { ...current, num: 2, label: 'Day 2 · 이어서 하기', topics: '형용사·부사 자리 · Where 의문문', meta: '실전 4 / 25', href: 'Question.dc.html' },
      { ...todo, num: 3, label: 'Day 3', topics: '대명사 · When 의문문', meta: '', href: 'DayStart.dc.html' },
      { ...todo, num: 4, label: 'Day 4', topics: '동사 자리와 수 일치 · What·Which 의문문', meta: '', href: 'DayStart.dc.html' },
      { ...todo, num: 5, label: 'Day 5', topics: '시제 · How 의문문', meta: '', href: 'DayStart.dc.html' },
      { ...todo, num: 6, label: 'Day 6', topics: '능동태와 수동태 · Why 의문문', meta: '', href: 'DayStart.dc.html' }
    ];
    const phases = [
      { name: '2단계 · 어휘와 문맥', meta: 'Part 5 + 6 + 2 · Day 17–24 · 0 / 8일' },
      { name: '3단계 · 독해와 대화', meta: 'Part 7 + 3 + 4 · Day 25–36 · 0 / 12일' },
      { name: '4단계 · 미니 모의고사', meta: '전 파트 혼합 · Day 37–40 · 0 / 4일' }
    ];
    return { days, phases };
  }
}
</script>
</body>
</html>
